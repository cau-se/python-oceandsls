[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "CP-DSL-Language-Server"
version = "0.41.0"
authors = [
    { name = "Reiner Jung" },
    { name = "sgu", email = "sgu@informatik.uni-kiel.de" },
]
description = "CP-DSL: configuration and parametrization of ocean models (language servers and generator)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
dependencies = [
    "odsllib>=0.40.0,<1",
    # The generated parsers (conflspserver/gen, dcllspserver/gen) are built with ANTLR 4.13.1
    "antlr4-python3-runtime>=4.13.1,<4.14",
    "pygls>=1.1,<2",
    "lsprotocol>=2023.0.0",
    "Jinja2>=3.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# Unit checks and conversions (cpdsl.generator.calculator.unit_calculator) need cfunits and the UDUNITS-2 C library;
# without them only custom units are compared
units = ["odsllib[units]"]
test = ["pytest>=7", "parameterized"]

[project.urls]
"oceandsl · GitLab" = "https://git.se.informatik.uni-kiel.de/oceandsl"
"OceanDSL · GitHub" = "https://github.com/cau-se/python-oceandsls"

[project.scripts]
cp_dsl = "conflspserver.__main__:main"
dcl_dsl = "dcllspserver.__main__:main"
cp_dsl_generate = "cpdsl.generator.__main__:main"

[tool.setuptools.packages.find]
include = ["conflspserver*", "dcllspserver*", "cpdsl*"]
exclude = ["conflspserver.gen.java*", "dcllspserver.gen.java*"]
namespaces = false

[tool.setuptools.package-data]
"cpdsl.generator.generators.mitgcm.templates" = ["*.template", "*.j2"]
"cpdsl.generator.generators.uvic.templates" = ["*.template"]

[tool.pytest.ini_options]
pythonpath = [".", "test"]
testpaths = ["test"]
# test modules in different folders share names (e.g. visitor_base_test.py)
# test/main_test.py runs the generator tests with unittest; pytest collects them from their own modules
addopts = "--import-mode=importlib --ignore=test/main_test.py"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
