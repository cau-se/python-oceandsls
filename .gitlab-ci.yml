stages:
  - test
  - build
  # GitLab Pages: uncomment the deploy stage and the pages job at the end of this file once Pages is available
  # - deploy

# Unit and language server tests of all Python packages (requires-python >= 3.10)
tests:
  tags:
    - oceandsl
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12"]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make
    - pip install -r requirements-dev.txt
  script:
    - make test

# Build sdists/wheels and validate them like PyPI does (twine check)
dist:
  tags:
    - oceandsl
  stage: build
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make
    - pip install build twine
  script:
    - make check-dist
  artifacts:
    paths:
      - dist

pylint:
  tags:
    - oceandsl
  stage: test
  image: python:3.10-slim
  before_script:
    - mkdir -p public/badges public/lint
    - echo undefined > public/badges/$CI_JOB_NAME.score
    # Install the packages and their dependencies so pylint can resolve imports (antlr4, pygls, odsllib, ...);
    # otherwise hundreds of import-error messages lower the score
    - pip install -r requirements-dev.txt pylint-gitlab
  script:
    # A single pylint run writes all reports: text to the log (and the score), Code Climate for merge requests
    # and an HTML report (job artifact)
    - >
      pylint --exit-zero
      --output-format=text,pylint_gitlab.GitlabCodeClimateReporter:codeclimate.json,pylint_gitlab.GitlabPagesHtmlReporter:public/lint/index.html
      $(find -type f -name "*.py" ! -path "**/.venv/**" ! -path "*/gen/*")
      | tee /tmp/pylint.txt
    - sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' /tmp/pylint.txt > public/badges/$CI_JOB_NAME.score
  after_script:
    - anybadge --overwrite --label $CI_JOB_NAME --value=$(cat public/badges/$CI_JOB_NAME.score) --file=public/badges/$CI_JOB_NAME.svg 4=red 6=orange 8=yellow 10=green
    - |
      echo "Your score is: $(cat public/badges/$CI_JOB_NAME.score)"
  # GitLab Pages is not available on this instance. The report and the badge are job artifacts:
  # - merge requests link them as "pylint report" (expose_as)
  # - the project badge shows the badge of the latest successful pipeline on main:
  #   https://git.se.informatik.uni-kiel.de/oceandsl/python-oceandsls/-/jobs/artifacts/main/raw/public/badges/pylint.svg?job=pylint
  #   GitLab keeps the artifacts of the latest successful pipeline independently of expire_in
  #   ("Keep artifacts from most recent successful jobs", enabled by default)
  artifacts:
    expose_as: "pylint report"
    paths:
      - public/lint/index.html
      - public/badges/
    reports:
      codequality: codeclimate.json
    expire_in: 30 days
    when: always

# GitLab Pages is not enabled on this GitLab instance. To publish the lint report and the badge on Pages,
# uncomment the deploy stage above and this job. It publishes the public/ folder of the pylint job:
#   <pages-url>/lint/            HTML report
#   <pages-url>/badges/pylint.svg score badge
#
# pages:
#   tags:
#     - oceandsl
#   stage: deploy
#   image: alpine:latest
#   # Publish the lint report and badge as soon as pylint is done, even if the tests fail
#   needs:
#     - pylint
#   script:
#     - echo
#   artifacts:
#     paths:
#       - public
#   only:
#     refs:
#       - main
