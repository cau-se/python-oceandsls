stages:
  - test
  - build
  # GitLab Pages: uncomment the deploy stage and the pages job at the end of this file once Pages is available
  # - deploy

# Jobs of regular pipelines (pushes, web, API, ...). They do not run in merge request pipelines (as before, to avoid
# duplicate pipelines) nor in the scheduled artifact cleanup (ARTIFACT_CLEANUP == "true").
.regular-pipeline:
  rules:
    - if: $ARTIFACT_CLEANUP == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success

# Unit and language server tests of all Python packages (requires-python >= 3.10) with branch coverage (.coveragerc)
tests:
  extends: .regular-pipeline
  tags:
    - oceandsl
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12"]
  before_script:
    # libudunits2-0: UDUNITS-2 C library of cfunits, so that the unit checks and conversions are tested as well
    - apt-get update && apt-get install -y --no-install-recommends make libudunits2-0
    - pip install -r requirements-dev.txt
  script:
    - make coverage
  # Total of the coverage summary (statements and branches): shown in the job, the merge request and the coverage badge
  coverage: '/^TOTAL\s.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    # Line coverage in the merge request diff
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Build sdists/wheels and validate them like PyPI does (twine check)
dist:
  extends: .regular-pipeline
  tags:
    - oceandsl
  stage: build
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make
    - pip install build twine
  script:
    - make check-dist
  artifacts:
    paths:
      - dist

pylint:
  extends: .regular-pipeline
  tags:
    - oceandsl
  stage: test
  image: python:3.10-slim
  before_script:
    - mkdir -p public/badges public/lint
    - echo undefined > public/badges/$CI_JOB_NAME.score
    # Install the packages and their dependencies so pylint can resolve imports (antlr4, pygls, odsllib, ...);
    # otherwise hundreds of import-error messages lower the score
    - pip install -r requirements-dev.txt pylint-gitlab
  script:
    # A single pylint run of the packages (settings in .pylintrc, as make lint) writes all reports: the text report
    # (with the score) and an HTML report as job artifacts, Code Climate for merge requests. The log only shows a
    # summary, so it stays small. The job fails on errors (E) and fatal messages (F) only; the score is informative.
    - >
      pylint --fail-under=0 --fail-on=E,F --recursive=y
      --output-format=text:public/lint/pylint.txt,pylint_gitlab.GitlabCodeClimateReporter:codeclimate.json,pylint_gitlab.GitlabPagesHtmlReporter:public/lint/index.html
      antlrLib tdd-dsl bgc-dsl cp-dsl ci
  after_script:
    - sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' public/lint/pylint.txt > public/badges/$CI_JOB_NAME.score || true
    # Block scalars: the grep patterns contain ": ", which YAML would read as a mapping in a plain scalar
    - |
      echo "Messages per category (C convention, R refactor, W warning, E error, F fatal):"
      grep -oE '^[^ ]+:[0-9]+:[0-9]+: [CRWEF]' public/lint/pylint.txt | awk '{print $NF}' | sort | uniq -c || true
    - |
      echo "Errors:"
      grep -E '^[^ ]+:[0-9]+:[0-9]+: [EF][0-9]{4}:' public/lint/pylint.txt || echo "none"
    - anybadge --overwrite --label $CI_JOB_NAME --value=$(cat public/badges/$CI_JOB_NAME.score) --file=public/badges/$CI_JOB_NAME.svg 4=red 6=orange 8=yellow 10=green
    - |
      echo "Your score is: $(cat public/badges/$CI_JOB_NAME.score)"
  # GitLab Pages is not available on this instance. The report and the badge are job artifacts:
  # - merge requests link them as "pylint report" (expose_as)
  # - the project badge shows the badge of the latest successful pipeline on main:
  #   https://git.se.informatik.uni-kiel.de/oceandsl/python-oceandsls/-/jobs/artifacts/main/raw/public/badges/pylint.svg?job=pylint
  # The artifacts do not expire by themselves: the scheduled cleanup-artifacts job deletes them after 30 days but
  # always keeps the newest 5 on the default branch, which expire_in cannot express.
  artifacts:
    expose_as: "pylint report"
    paths:
      - public/lint/
      - public/badges/
    reports:
      codequality: codeclimate.json
    expire_in: never
    when: always

# Deletes pylint artifacts older than 30 days, except the newest 5 on the default branch (ci/cleanup_artifacts.py).
# Runs only in a pipeline schedule on main with the variable ARTIFACT_CLEANUP = "true". Requires the masked and
# protected CI/CD variable ARTIFACT_CLEANUP_TOKEN: a fine-grained personal access token for this project with the
# permissions "Job: Read" and "Job Artifact: Delete" (its owner needs the Maintainer role in the project).
# Optional: ARTIFACT_CLEANUP_ERASE_LOGS = "true" in the schedule also erases pylint jobs that only have their log left
# and are older than six months (the log is removed, cannot be undone); the token then also needs "Job: Delete".
# Set ARTIFACT_CLEANUP_DRY_RUN = "true" in the schedule to only list what would be deleted and erased.
cleanup-artifacts:
  tags:
    - oceandsl
  stage: test
  image: python:3.12-slim
  variables:
    ARTIFACT_CLEANUP_JOB: pylint
    ARTIFACT_CLEANUP_KEEP: "5"
    ARTIFACT_CLEANUP_MAX_AGE_DAYS: "30"
    ARTIFACT_CLEANUP_ERASE_LOGS: "false"
    ARTIFACT_CLEANUP_LOG_MAX_AGE_DAYS: "183"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ARTIFACT_CLEANUP == "true"
  script:
    - python3 ci/cleanup_artifacts.py

# GitLab Pages is not enabled on this GitLab instance. To publish the lint report and the badge on Pages,
# uncomment the deploy stage above and this job. It publishes the public/ folder of the pylint job:
#   <pages-url>/lint/            HTML report
#   <pages-url>/badges/pylint.svg score badge
